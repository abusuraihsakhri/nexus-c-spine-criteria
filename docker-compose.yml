version: '3.8'

services:
  nexus-c-spine-criteria:
    build: .
    container_name: nexus-c-spine-criteria
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=nexus-c-spine-criteria-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
