[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-c-spine-criteria"
version = "3.1.0"
description = "Five-item NEXUS low-risk cervical-spine decision support for blunt trauma"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
keywords = ["nexus", "cervical-spine", "blunt-trauma", "clinical-decision-support"]
dependencies = ["pydantic>=2.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "httpx>=0.27"]

[project.scripts]
nexus-c-spine = "nexus_cspine:main"
nexus-c-spine-legacy = "cli:main"

[tool.setuptools]
py-modules = ["nexus_cspine", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
